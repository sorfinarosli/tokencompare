# Estimated API pricing in USD per 1 million INPUT tokens.
#
# Each model has:
#   display_name       - human-friendly name shown in the UI
#   type               - "api" or "open-source"
#   input_per_million  - configured API input-token price
#   price_source       - source used for pricing information
#   price_date         - date pricing was last verified
#
# Cost estimates exclude output tokens and other operating expenses.
# Gemini 3.8 Flash introductory pricing applies through 2026-12-31.
# Recheck Gemini pricing before 2027-01-01.
#
# Qwen 2.5 uses a local tokenizer.
# Its 0.0 price is a configuration placeholder, NOT a zero-cost
# inference estimate. The dashboard displays N/A for its API cost.

gpt-4o:
  display_name: "GPT-4o"
  type: api
  input_per_million: 2.5
  price_source: "https://openai.com/api/pricing/"
  price_date: "2026-10-06"

gemini-3.8-flash:
  display_name: "Gemini 3.8 Flash"
  type: api
  input_per_million: 0.75
  price_source: "https://ai.google.dev/gemini-api/docs/pricing"
  price_date: "2026-10-06"

qwen2.5-0.5b:
  display_name: "Qwen 2.5"
  type: open-source
  input_per_million: 0.0
  price_source: "https://huggingface.co/Qwen/Qwen2.5-0.5B"
  price_date: ""
